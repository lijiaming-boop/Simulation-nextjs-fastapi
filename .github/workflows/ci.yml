name: CI

on:
  push:
    branches: [master, main, refactor/nextjs-fastapi]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check core agent apps/api evaluation simulation config --exclude .venv
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Regression eval gate（零 LLM 成本，基线比对）
        run: python -m evaluation.run_eval --compare-baseline

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
